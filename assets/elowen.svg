<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-labelledby="title desc">
  <title id="title">Elowen, spirit reviver</title>
  <desc id="desc">Full-body fantasy elf healer with flowing pale-gold hair, a white and forest-green robe, gold leaf details, and a crystal-tipped staff. The background is transparent.</desc>

  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff4c9"/>
      <stop offset=".48" stop-color="#e4c68b"/>
      <stop offset="1" stop-color="#a77c43"/>
    </linearGradient>

    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#ffe3cb"/>
      <stop offset="1" stop-color="#d99f82"/>
    </linearGradient>

    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffef2"/>
      <stop offset=".58" stop-color="#f3e8cf"/>
      <stop offset="1" stop-color="#cbbd9c"/>
    </linearGradient>

    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#539875"/>
      <stop offset=".52" stop-color="#28674e"/>
      <stop offset="1" stop-color="#163f36"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a7"/>
      <stop offset=".5" stop-color="#cf9b42"/>
      <stop offset="1" stop-color="#8c5b26"/>
    </linearGradient>

    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5ffff"/>
      <stop offset=".42" stop-color="#8cebea"/>
      <stop offset="1" stop-color="#438bd6"/>
    </linearGradient>

    <radialGradient id="crystalGlow">
      <stop stop-color="#83f6ed" stop-opacity=".48"/>
      <stop offset="1" stop-color="#83f6ed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Crystal staff -->
  <ellipse cx="62" cy="37" rx="36" ry="35" fill="url(#crystalGlow)"/>

