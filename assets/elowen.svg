<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="title desc">
  <title id="title">Elowen, spirit reviver</title>
  <desc id="desc">A fantasy healer wearing a deep forest-green hood, with glowing teal eyes and a crystal pendant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183d3a"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c7660"/>
      <stop offset="1" stop-color="#173a3d"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fff3"/>
      <stop offset="0.5" stop-color="#76f2dc"/>
      <stop offset="1" stop-color="#8b9aff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7fffe2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7fffe2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="120" cy="145" r="112" fill="url(#glow)"/>

